name: Notify new free models

on:
  schedule:
    - cron: "0 */6 * * *"   # mỗi 6 tiếng (03:00, 09:00, 15:00, 21:00 giờ VN)
  workflow_dispatch: {}     # cho phép chạy tay từ tab Actions

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install gspread google-auth

      - name: Quét catalog, ghi sheet và báo model free mới qua Telegram
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_free_models.py
